    - generic [ref=e113]:
      - button "Toggle Hindi / English translation" [ref=e114] [cursor=pointer]: 🌐 हिंदी में पढ़ें
      - region [ref=e117]:
        - heading "What is Car Insurance?" [level=1] [ref=e118]
        - paragraph [ref=e120]: Car insurance provides financial protection against damage to your car and third-party liabilities arising from accidents and other covered events. Depending on the policy you choose, it can cover your own vehicle, third-party liabilities, theft, fire, natural calamities and more (as per policy terms). You can compare car insurance plans from multiple insurers on Coverfox and choose coverage based on your car, budget and needs.
        - button "Buy Car Insurance Online" [ref=e122] [cursor=pointer]
      - region [ref=e125]:
        - heading "Why Do You Need Car Insurance?" [level=2] [ref=e126]
        - paragraph [ref=e127]: "In India, driving a car without valid four wheeler insurance is illegal and carries financial risk. Here’s why car insurance is important:"
        - generic [ref=e128]:
          - generic "Reasons to buy car insurance" [ref=e129]:
            - generic [ref=e130]:
              - heading "Legal Requirement" [level=3] [ref=e136]
              - paragraph [ref=e137]:
                - text: Third-party car insurance is mandatory under the
                - link "Motor Vehicles Act, 1988" [ref=e138] [cursor=pointer]:
                  - /url: https://www.indiacode.nic.in/bitstream/123456789/9460/1/a1988-59.pdf
                - text: . Driving without it can lead to fines or other penalties.
            - generic [ref=e139]:
              - heading "Financial Protection" [level=3] [ref=e144]
              - paragraph [ref=e145]: Car accident repair costs are high, and a car insurance policy ensures this cost is covered (as per policy terms).
            - generic [ref=e146]:
              - heading "Third-party Liability Cover" [level=3] [ref=e152]
              - paragraph [ref=e153]: Liability arising from damage caused to another person or their property by your vehicle falls on you. Insurance ensures this liability is taken up with the insurer as per policy limits.
            - generic [ref=e154]:
              - heading "Peace of Mind" [level=3] [ref=e159]
              - paragraph [ref=e160]: If you have car insurance, you can drive on the road stress-free, knowing that you are financially covered from fire, theft, accidents, natural disasters and man-made hazards as per policy terms.
          - generic [ref=e161]:
            - button "Previous" [ref=e162] [cursor=pointer]
            - tablist "Slide pages" [ref=e165]:
              - button "Go to page 1" [ref=e166] [cursor=pointer]
              - button "Go to page 2" [ref=e167] [cursor=pointer]
            - button "Next" [ref=e168] [cursor=pointer]
      - region [ref=e173]:
        - heading "Types of Car Insurance" [level=2] [ref=e174]
        - list [ref=e175]:
          - listitem [ref=e176]:
            - heading "Third-Party Car Insurance" [level=3] [ref=e182]
            - generic [ref=e183]:
              - paragraph [ref=e184]:
                - text: In
                - link "third-party car insurance" [ref=e185] [cursor=pointer]:
                  - /url: https://www.coverfox.com/car-insurance/third-party-car-insurance/
                - text: ", liability that arises from an accident towards another person or property is covered. Injury, death or property damage caused by the insured four-wheeler owner is compensated by the insurer as per legal limits."
              - paragraph [ref=e186]:
                - text: It is the minimum required cover to drive legally in India. All four-wheeler insurance policies must have it. Although it does not pay for repairs for damages caused to your own vehicle. Claims made under third-party insurance are often settled by the
                - link "Motor Accident Claims Tribunal (MACT)" [ref=e187] [cursor=pointer]:
                  - /url: https://mumact.dcourts.gov.in/
                - text: through a legal process.
            - button "Get Quote" [ref=e189] [cursor=pointer]
          - listitem [ref=e190]:
            - heading "Standalone Own Damage Car Insurance" [level=3] [ref=e196]
            - generic [ref=e197]:
              - paragraph [ref=e198]: Own damage cover is for covering damages caused to your own vehicle. These damages may include damage, fire, theft, natural disaster or manmade hazards, depending on the policy. It does not include third-party liability and is bought separately by those who are looking for coverage for their own vehicle.
              - paragraph [ref=e199]:
                - text: You can buy
                - link "Own Damage Car Insurance" [ref=e200] [cursor=pointer]:
                  - /url: https://www.coverfox.com/car-insurance/standalone-own-damage-car-insurance/
                - text: "only if you already have a third-party insurance policy, to stay legally compliant. One important note: Own damage cover on its own does not meet the legal requirement for third-party liability."
            - button "Get Quote" [ref=e202] [cursor=pointer]
          - listitem [ref=e203]:
            - heading "Comprehensive Car Insurance" [level=3] [ref=e208]
            - generic [ref=e209]:
              - paragraph [ref=e210]: Comprehensive car insurance is a mix of own damage cover and third-party liability in a single policy. In this, damage done to the insured vehicle from insured events and also damage caused to third-party, both are covered as per policy terms.
              - paragraph [ref=e211]:
                - text: It can be further customised with add-ons like zero depreciation, engine protection, return to invoice, etc.
                - link "Comprehensive car insurance" [ref=e212] [cursor=pointer]:
                  - /url: https://www.coverfox.com/car-insurance/comprehensive-car-insurance/
                - text: may be suitable for new car owners looking for both third-party liability and own-damage protection.
            - button "Get Quote" [ref=e214] [cursor=pointer]
      - region [ref=e217]:
        - heading "What Does Car Insurance Cover?" [level=2] [ref=e218]
        - generic [ref=e219]:
          - generic [ref=e220]:
            - heading "What Is Covered Under Car Insurance?" [level=3] [ref=e221]
            - list [ref=e222]:
              - listitem [ref=e223]:
                - button "Accidental damage" [expanded] [ref=e224] [cursor=pointer]
                - paragraph [ref=e233]: Repair costs from collisions, overturning, or self-inflicted accidents.
              - listitem [ref=e234]:
                - button "Theft" [ref=e235] [cursor=pointer]
