      - region [ref=e515]:
        - heading "What Factors Affect Car Insurance Premium?" [level=2] [ref=e516]
        - paragraph [ref=e517]: "If you’ve bought a car, then it is important to understand how premiums work. The following factors affect car insurance premiums:"
        - list [ref=e519]:
          - listitem [ref=e520]:
            - generic [ref=e525]:
              - heading "Car's Insured Declared Value (IDV)" [level=3] [ref=e526]
              - paragraph [ref=e527]: IDV is the max amount that your insurer pays in case the car gets stolen or totalled. It is calculated as the current market value of the insured car after depreciation. The higher the IDV, the higher the premiums. However, lowering IDV to reduce the car insurance price may result in a lower claim settlement in case of total loss or theft.
          - listitem [ref=e528]:
            - generic [ref=e533]:
              - heading "Location" [level=3] [ref=e534]
              - paragraph [ref=e535]: The location where the car is registered affects premiums due to accident risks, theft stats, and repair costs in that region. Metro cities generally have higher premium rates than smaller towns or rural areas, mainly due to traffic density and claim frequency.
          - listitem [ref=e536]:
            - generic [ref=e541]:
              - heading "Car's Age, Make and Model" [level=3] [ref=e542]
              - paragraph [ref=e543]: As the car gets old, its IDV depreciates, decreasing the car insurance price. The make and model of the car affect the price of the vehicle and also determine repair costs, directly affecting the new car insurance price.
          - listitem [ref=e544]:
            - generic [ref=e549]:
              - heading "No Claim Bonus (NCB)" [level=3] [ref=e550]
              - paragraph [ref=e551]:
                - link "NCB car insurance" [ref=e552] [cursor=pointer]:
                  - /url: https://www.coverfox.com/car-insurance/add-ons/no-claim-bonus/
                - text: is a discount insurers give on own-damage policy renewals for maintaining claim-free years. This discount can go up to 50%, depending on the insurer. Also, missing a car insurance renewal can lead to loss of NCB.
        - button "View more" [ref=e554] [cursor=pointer]
